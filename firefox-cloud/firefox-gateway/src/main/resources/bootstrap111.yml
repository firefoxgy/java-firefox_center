firefox:
  server:
    port: ${PORT:8910}
    management-port: ${MNG_PORT:18910}
  nacos:
    server-addr: ${FIREFOX_SERVER_ADDR:}
    namespace: 180399dc-2d21-43ec-920f-528713308b2d
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    group: firefox-cloud
    yml:
      group: DEFAULT_GROUP
  redis:
    ip: ${FIREFOX_IP:}
    port: 6379
    password: ${FIREFOX_PASSWORD:}
    database: 0

server:
  port: ${firefox.server.port}
spring:
  application:
    name: '@project.artifactId@'
  main:
    allow-bean-definition-overriding: true
  mail:
    host: smtp.163.com
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    default-encoding: UTF-8
  cloud:
    nacos:
      config:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${firefox.nacos.namespace}
        group: ${firefox.nacos.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
        context-path: /nacos
      discovery:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${spring.cloud.nacos.config.namespace}
        group: ${spring.cloud.nacos.config.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
management:
  server:
    port: ${firefox.server.management-port}
  endpoints:
    web:
      exposure:
        include: '*'
        exclude:
  endpoint:
    health:
      show-details: always


