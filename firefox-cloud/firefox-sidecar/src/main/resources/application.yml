firefox:
  server:
    port: ${PORT:9001}
    name: ${NAME:metabase}
  agent:
    ip: ${FIREFOX_IP:}
    port: ${AGENT_PORT:3100}
  nacos:
    server-addr: ${NACOS_SERVERADDR:@nacos.server-addr@}
    namespace: ${NACOS_ID:@nacos.namespace@}
    username: ${NACOS_USERNAME:@nacos.username@}
    password: ${NACOS_PASSWORD:@nacos.password@}
    group: ${NACOS_GROUP:@nacos.group@}

server:
  port: ${firefox.server.port}
spring:
  cloud:
    nacos:
      config:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${firefox.nacos.namespace}
        group: ${firefox.nacos.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
        context-path: /nacos
      discovery:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${spring.cloud.nacos.config.namespace}
        group: ${spring.cloud.nacos.config.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
    gateway:
      discovery:
        locator:
          enabled: true

  application:
    name: ${firefox.server.name}
sidecar:
  # 异构微服务的IP
  ip: ${firefox.agent.ip}
  # 异构微服务的端口
  port: ${firefox.agent.port}
  # 异构微服务的健康检查URL
  health-check-url: http://${firefox.agent.ip}:${firefox.agent.port}
management:
  endpoint:
    health:
      show-details: always