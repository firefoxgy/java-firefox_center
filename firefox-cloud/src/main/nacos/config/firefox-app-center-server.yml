server:
  port: 8801
  management-port: 18801

firefox:
  swagger:
    docket:
      user-center:
        title: 应用中心模块
        base-package: com.firefox.cloud.app.controller
  mysql:
    ip: ${FIREFOX_IP:}
    port: 3307
    driverClassName: com.mysql.cj.jdbc.Driver
    database: firefox_app
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    url: ${FIREFOX_URL:}

# mysql 通用配置
spring:
  datasource:
    url: ${FIREFOX_URL:}
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    driver-class-name: ${firefox.mysql.driverClassName}
  druid:
    # 连接池的配置信息
    # 初始化大小，最小，最大
    initial-size: 10
    min-idle: 10
    maxActive: 20
    # 配置获取连接等待超时的时间
    maxWait: 60000
    # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    timeBetweenEvictionRunsMillis: 60000
    # 配置一个连接在池中最小生存的时间，单位是毫秒
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    # 打开PSCache，并且指定每个连接上PSCache的大小
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
    filters: stat,wall,slf4j
    filter:
      wall:
        enabled: true
        config:
          commentAllow: true
          multiStatementAllow: true
          noneBaseStatementAllow: true
    # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
    connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
    web-stat-filter:
      enabled: true
      url-pattern: /*
      exclusions: "*.js , *.gif ,*.jpg ,*.png ,*.css ,*.ico , /druid/*"
      session-stat-max-count: 1000
      profile-enable: true
      session-stat-enable: false
    stat-view-servlet:  #展示Druid的统计信息,StatViewServlet的用途包括：1.提供监控信息展示的html页面2.提供监控信息的JSON API
      enabled: true
      url-pattern: /druid/*   #根据配置中的url-pattern来访问内置监控页面，如果是上面的配置，内置监控页面的首页是/druid/index.html
      reset-enable: true    #允许清空统计数据
      login-username: ${FIREFOX_LOGIN_USERNAME:}
      login-password: ${FIREFOX_LOGIN_PASSWORD:}

# default context 连接超时时间
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000

mybatis-plus:
  mapper-locations:
    - classpath*:com/firefox/**/xml/*Mapper.xml
  global-config:
    db-config:
      id-type: INPUT
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      select-strategy: NOT_EMPTY
  configuration:
    #配置返回数据库(column下划线命名&&返回java实体是驼峰命名)，自动匹配无需as（没开启这个，SQL需要写as： select user_id as userId）
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true

management:
  server:
    port: ${server.management-port}
  endpoints:
    web:
      exposure:
        include: '*'
        exclude:
  endpoint:
    health:
      show-details: always

my:
  security:
    web:
      resourceIgnore:
        - /getByphone.do
      securityIgnore:
        - /getByphone.do