########################## 统一变量配置 ##########################

##### 数据库配置
firefox.datasource.ip=${FIREFOX_FIREFOX_DATASOURCE_IP:}
firefox.datasource.port=3307
firefox.datasource.username=${FIREFOX_FIREFOX_DATASOURCE_USERNAME:}
firefox.datasource.password=${FIREFOX_FIREFOX_DATASOURCE_PASSWORD:}

firefox.datasource.slave1.ip=${FIREFOX_FIREFOX_DATASOURCE_SLAVE1_IP:}
firefox.datasource.slave1.port=3307
firefox.datasource.slave1.username=${FIREFOX_FIREFOX_DATASOURCE_SLAVE1_USERNAME:}
firefox.datasource.slave1.password=${FIREFOX_FIREFOX_DATASOURCE_SLAVE1_PASSWORD:}

##### redis配置
firefox.redis.ip=${FIREFOX_FIREFOX_REDIS_IP:}
firefox.redis.port=6379
firefox.redis.password=${FIREFOX_FIREFOX_REDIS_PASSWORD:}
firefox.redis.database=0
firefox.redis.database-sys=1
firefox.redis.timeout=5000

##### elasticsearch配置
firefox.elasticsearch.cluster-name=my-es
firefox.elasticsearch.cluster-nodes=${FIREFOX_FIREFOX_ELASTICSEARCH_CLUSTER_NODES:}

##### sentinel配置
firefox.sentinel.dashboard=127.0.0.1:6999