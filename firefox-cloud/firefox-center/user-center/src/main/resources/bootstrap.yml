firefox:
  server:
    port: ${PORT:8003}
    management-port: ${MANAGEMENT_PORT:18003}
  nacos:
    server-addr: ${FIREFOX_SERVER_ADDR:}
    namespace: b8c05865-7bbd-476a-be3d-cc4a0eff8faf
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    group: open
    yml:
      group: DEFAULT_GROUP
  redis:
    ip: ${FIREFOX_IP:}
    port: 6079
    password: ${FIREFOX_PASSWORD:}
    database: 0
    timeout: 5000
  ##### 数据库配置
  datasource1:
    ip: ${FIREFOX_IP:}
    port: 3307
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}

server:
  port: ${firefox.server.port}
spring:
  application:
    name: 'user-center'
  main:
    allow-bean-definition-overriding: true
  mail:
    host: smtp.163.com
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    default-encoding: UTF-8
  cloud:
    nacos:
      config:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${firefox.nacos.namespace}
        group: ${firefox.nacos.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
        context-path: /nacos
      discovery:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${spring.cloud.nacos.config.namespace}
        group: ${spring.cloud.nacos.config.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
management:
  server:
    port: ${firefox.server.management-port}
  endpoints:
    web:
      exposure:
        include: '*'
        exclude:
  endpoint:
    health:
      show-details: always