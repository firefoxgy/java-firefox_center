spring:
  datasource:
    url: ${FIREFOX_URL:}
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  redis:
    host: ${firefox.redis.ip}
    port: ${firefox.redis.port}
    password: ${FIREFOX_PASSWORD:}
    database: ${firefox.redis.database}
    timeout: ${firefox.redis.timeout}
    command-timeout: 5000
    max-attempts: 5
    max-redirects: 3
    max-active: 20
    max-wait: -1
    max-idle: 8
    min-idle: 2
    test-on-borrow: true

mybatis-plus:
  mapper-locations:
    - classpath*:com/firefox/center/**/xml/*Mapper.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.firefox.center.user.model
  global-config:
    db-config:
      id-type: auto

# Ribbon 配置
ribbon:
  # 连接超时
  ConnectTimeout: 2000
  # 响应超时
  ReadTimeout: 5000

firefox:
  swagger:
    enabled: true
    title: 用户中心
    description: 用户中心接口文档
    version: 1.0
    base-package: com.firefox.center.user.controller
  cache-manager:
    configs:
      - key: menu
        second: 600
      - key: user
        second: 1800
