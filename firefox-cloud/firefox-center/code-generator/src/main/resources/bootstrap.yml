firefox:
  nacos:
    server-addr: ${NACOS_SERVERADDR:@nacos.server-addr@}
    namespace: ${NACOS_ID:@nacos.namespace@}
    username: ${NACOS_USERNAME:@nacos.username@}
    password: ${NACOS_PASSWORD:@nacos.password@}
    group: ${NACOS_GROUP:@nacos.group@}
    yml:
      group: ${NACOS_YML_GROUP:@nacos.yml.group@}

server:
  port: 7300

spring:
  application:
    name: code-generator
  cloud:
    nacos:
      config:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        file-extension: yml
        shared-dataids: common.yml
        refreshable-dataids: common.yml
      discovery:
        server-addr: ${FIREFOX_SERVER_ADDR:}