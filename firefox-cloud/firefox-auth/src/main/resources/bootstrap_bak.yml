firefox:
  server:
    port: ${PORT:8900}
    management-port: ${MANAGEMENT_PORT:18900}
  nacos:
    server-addr: ${FIREFOX_SERVER_ADDR:}
    namespace: 52d3753f-b40c-4f2e-9ddb-7552dd3965c9
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    group: test
    yml:
      group: DEFAULT_GROUP
  redis:
    ip: ${FIREFOX_IP:}
    port: 6379
    password: ${FIREFOX_PASSWORD:}
    database: 0
    timeout: 5000
  ##### 数据库配置
  datasource1:
    ip: ${FIREFOX_IP:}
    port: 4000
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}

server:
  port: ${firefox.server.port}
spring:
  application:
    name: 'test-auth'
  main:
    allow-bean-definition-overriding: true
  mail:
    host: smtp.163.com
    username: ${FIREFOX_USERNAME:}
    password: ${FIREFOX_PASSWORD:}
    default-encoding: UTF-8
  cloud:
    nacos:
      config:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        context-path: /nacos
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
      discovery:
        server-addr: ${FIREFOX_SERVER_ADDR:}
        namespace: ${firefox.nacos.namespace}
        group: ${firefox.nacos.group}
        username: ${FIREFOX_USERNAME:}
        password: ${FIREFOX_PASSWORD:}
management:
  server:
    port: ${firefox.server.management-port}
  endpoints:
    web:
      exposure:
        include: '*'
        exclude:
  endpoint:
    health:
      show-details: always
encrypt:
  key-store:
    location: classpath:firefoxcenter.jks
    secret: ${FIREFOX_SECRET:}
    alias: firefoxcenter